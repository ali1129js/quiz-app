      (function () {
        var known = { khaki: 1, graphite: 1, midnight: 1 };
        var t = null;
        try { t = localStorage.getItem("quiz-app:theme:v1"); } catch (e) {}
        if (t === "light") t = "khaki";
        else if (t === "dark") t = "graphite";
        if (!known[t]) {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "graphite" : "khaki";
        }
        document.documentElement.dataset.theme = t;
        var m = "static";
        try { m = localStorage.getItem("quiz-app:motion:v1") || "static"; } catch (e) {}
        if (m !== "animated") m = "static";
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) m = "static";
        document.documentElement.dataset.motion = m;
      })();
    </script>
