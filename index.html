<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❓</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A JavaScript concepts quiz: basics, scope and lexical scope." />
    <title>JS Quiz</title>
    <script>
      (function () {
        var p = "system";
        try { p = localStorage.getItem("quiz-app:theme:v1") || "system"; } catch (e) {}
        if (p !== "light" && p !== "dark") p = "system";
        var t = p === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : p;
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.themePref = p;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
